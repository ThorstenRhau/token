# Copy mode
setw -g mode-style "bg=#3a3a37,fg=#c3c0b8"

# Clock
setw -g clock-mode-colour "#f4906f"

# Display panes
set -g display-panes-active-colour "#f4906f"
set -g display-panes-colour "#8a8884"
