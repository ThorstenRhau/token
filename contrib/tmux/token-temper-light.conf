# Pane borders
set -g pane-border-style "fg=#636d79"
set -g pane-active-border-style "fg=#055667"

# Messages
set -g message-style "bg=#f5f7f8,fg=#283039"
set -g message-command-style "bg=#f5f7f8,fg=#283039"

# Copy mode
setw -g mode-style "bg=#d1d6db,fg=#283039"

# Clock
setw -g clock-mode-colour "#005850"

# Display panes
set -g display-panes-active-colour "#005850"
set -g display-panes-colour "#636d79"
