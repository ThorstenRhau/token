# Status bar
set -g status-style "bg=#ebeff2,fg=#46515d"
set -g status-left-style "bg=#ebeff2,fg=#005850,bold"
set -g status-right-style "bg=#ebeff2,fg=#5a6571"

# Window status
setw -g window-status-style "bg=#ebeff2,fg=#5a6571"
setw -g window-status-current-style "bg=#ebeff2,fg=#055667,bold"
setw -g window-status-activity-style "bg=#ebeff2,fg=#8c6312"
