# Pane borders
set -g pane-border-style "fg=#626C77"
set -g pane-active-border-style "fg=#7FA2BA"

# Messages
set -g message-style "bg=#272C33,fg=#DCE1E6"
set -g message-command-style "bg=#272C33,fg=#DCE1E6"

# Copy mode
setw -g mode-style "bg=#3A414A,fg=#DCE1E6"

# Clock
setw -g clock-mode-colour "#D58A6F"

# Display panes
set -g display-panes-active-colour "#D58A6F"
set -g display-panes-colour "#626C77"
