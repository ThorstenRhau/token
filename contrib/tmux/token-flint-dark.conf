# Status bar
set -g status-style "bg=#161B20,fg=#C2C9D0"
set -g status-left-style "bg=#161B20,fg=#D58A6F,bold"
set -g status-right-style "bg=#161B20,fg=#929BA5"

# Window status
setw -g window-status-style "bg=#161B20,fg=#929BA5"
setw -g window-status-current-style "bg=#161B20,fg=#7FA2BA,bold"
setw -g window-status-activity-style "bg=#161B20,fg=#C6A15A"
